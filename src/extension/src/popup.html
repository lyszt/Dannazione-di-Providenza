<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dannazione di Providenza</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 350px;
      background: #f5f5f5;
    }

    .popup-container {
      background: white;
    }

    .popup-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .popup-header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .status-indicator {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
    }

    .status-indicator.connected {
      color: #4ade80;
    }

    .status-indicator.disconnected {
      color: #f87171;
    }

    .popup-content {
      padding: 16px;
    }

    .api-status {
      margin-bottom: 16px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 6px;
    }

    .api-status p {
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
    }

    .api-status strong {
      color: #111827;
    }

    .selected-text {
      margin-bottom: 16px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 6px;
    }

    .text-preview {
      margin: 8px 0;
      padding: 8px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      font-size: 12px;
      color: #374151;
      max-height: 100px;
      overflow-y: auto;
    }

    .hint {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 24px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: white;
      color: #374151;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #f9fafb;
      border-color: #d1d5db;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      margin-top: 8px;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="popup-container">
      <div style="padding: 20px; text-align: center;">
        <p>Loading...</p>
      </div>
    </div>
  </div>
  <script type="module" src="./popup/index.js"></script>
</body>
</html>
